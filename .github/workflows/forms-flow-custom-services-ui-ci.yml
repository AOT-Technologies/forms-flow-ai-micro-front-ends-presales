name: forms-flow-custom-services-ui-CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - release/*
      - develop-presales
    paths:
      - "forms-flow-custom-services-UI/**"
      - "VERSION"
  push:
    branches:
      - main
      - develop
      - release/*
      - develop-presales
    paths:
      - "forms-flow-custom-services-UI/**"
      - "VERSION"
defaults:
  run:
    shell: bash
    working-directory: ./forms-flow-custom-services-UI
jobs:
  Forms-Flow-Custom-Services-CI:
    name: Run Lint Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm ci
      - name: Run Lint
        run: |
          npm run lint
